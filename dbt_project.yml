# xengine-consumer-cfd-snowflake — the analytics/audit team's dbt project on Snowflake for the CFD tick estate. Reads the Kafka-Connect-
# written, Glue-catalogued Iceberg tick tables through Snowflake's Glue-backed Iceberg tables (AUTO_REFRESH, no manual pointer);
# writes Snowflake-managed Iceberg marts back to the same bucket. Models copied from dbt-demo/models/cfd (the single-project shape).
name: xengine_consumer_cfd_snowflake
version: "1.0.0"
config-version: 2
profile: xengine_consumer_cfd_snowflake
model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
on-run-start:
  - "{% if target.type == 'duckdb' %}ATTACH IF NOT EXISTS '073596371268' AS glue (TYPE iceberg, ENDPOINT_TYPE glue){% endif %}"

flags:
  enable_iceberg_materializations: True

tests:
  xengine_consumer_cfd_snowflake:
    +tags: ["cross_engine_mesh", "cross_engine", "role_consumer", "engine_snowflake", "cfd"]

models:
  xengine_consumer_cfd_snowflake:
    +tags: ["cross_engine_mesh", "cross_engine", "role_consumer", "engine_snowflake", "cfd"]
    +meta: {engine: snowflake, role: consumer}
    staging:
      +materialized: view
    marts:
      +materialized: table
      +table_format: "{{ 'iceberg' if target.type == 'snowflake' else none }}"
      +external_volume: "{{ 'CFD_LAKE_VOL' if target.type == 'snowflake' else none }}"
      +base_location_root: "{{ '_xengine_cfd' if target.type == 'snowflake' else none }}"
