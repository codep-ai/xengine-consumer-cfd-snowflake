version: 2
# The CFD tick lake as Snowflake sees it: Glue-backed Iceberg tables in DATAPAI.CFD_LAKE (catalog integration GLUE_STOCK_COMMON,
# external volume CFD_LAKE_VOL, AUTO_REFRESH) over the tables the Kafka Connect Iceberg sink writes and catalogues in Glue `cfd`.
# `physical_identity` is the engine-independent name the lineage stitcher joins on; the ClickHouse consumer declares the same names.
sources:
  - name: cfd_lake
    database: "{{ 'glue' if target.type == 'duckdb' else 'DATAPAI' }}"     # DuckDB dev target reads the Glue catalog directly
    schema: "{{ 'cfd' if target.type == 'duckdb' else 'CFD_LAKE' }}"
    config: {meta: {engine: snowflake, produced_by_engine: kafka_connect, physical_format: iceberg, catalog: "glue:cfd"}}
    tables:
      - name: tick_fx
        identifier: "{{ 'tick_fx' if target.type == 'duckdb' else 'TICK_FX' }}"
        config: {meta: {physical_identity: "glue:cfd.tick_fx"}}
      - name: tick_crypto
        identifier: "{{ 'tick_crypto' if target.type == 'duckdb' else 'TICK_CRYPTO' }}"
        config: {meta: {physical_identity: "glue:cfd.tick_crypto"}}
      - name: tick_index
        identifier: "{{ 'tick_index' if target.type == 'duckdb' else 'TICK_INDEX' }}"
        config: {meta: {physical_identity: "glue:cfd.tick_index"}}
      - name: tick_commodity
        identifier: "{{ 'tick_commodity' if target.type == 'duckdb' else 'TICK_COMMODITY' }}"
        config: {meta: {physical_identity: "glue:cfd.tick_commodity"}}